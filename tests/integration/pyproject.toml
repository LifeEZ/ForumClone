[project]
name = "hiver-integration-tests"
version = "0.1.0"
description = "Cross-service integration tests (docker compose: identity + content)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
markers = [
    "integration: requires docker compose stack (identity + content)",
]
