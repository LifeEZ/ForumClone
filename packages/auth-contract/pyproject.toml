[project]
name = "hiver-auth-contract"
version = "0.1.0"
description = "Shared access-token contract for Hiver services — claim names, token type, algorithm, TokenInvalidError, AccessClaims"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiver_auth_contract"]
